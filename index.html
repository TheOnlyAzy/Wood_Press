<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17351f"><title>Wood Press 0.3.2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f5f2;color:#182019}header{background:#17351f;color:#fff;padding:16px 18px;position:sticky;top:0;z-index:3;box-shadow:0 2px 10px #0002}h1{margin:0;font-size:24px}.sub{opacity:.78;font-size:12px;margin-top:3px}.wrap{max-width:1050px;margin:auto;padding:15px}.toolbar{display:flex;gap:8px;overflow:auto;margin-bottom:12px;padding-bottom:2px}.toolbar button{border:1px solid #cdd3cc;background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap}.toolbar button.active{background:#17351f;color:#fff}.stats{font-size:13px;color:#667064;margin:10px 0 15px}.card{background:#fff;border:1px solid #dde1dc;border-radius:14px;padding:15px;margin-bottom:10px;box-shadow:0 1px 2px #00000008}.top{display:flex;gap:8px;align-items:center;font-size:12px;color:#6c746b}.title{font-size:17px;font-weight:700;margin:8px 0;line-height:1.25}.summary{font-size:14px;line-height:1.45;color:#424a43}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}.tag{background:#eef1ed;border-radius:999px;padding:4px 8px;font-size:11px}.source{font-size:12px;color:#777}.source a{color:#175d2b;font-weight:700;text-decoration:none}.empty{padding:45px 15px;text-align:center;color:#777}.refresh{margin-left:auto;background:#fff;color:#17351f;border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.refresh:disabled{opacity:.65;cursor:wait}.note{background:#fff9df;border:1px solid #eee1a8;border-radius:12px;padding:12px;font-size:12px;line-height:1.4;margin-bottom:15px}.status{font-size:12px;margin:0 0 12px;color:#667064}.error{color:#a33}.ok{color:#27633a}@media(max-width:560px){header{padding:14px}.wrap{padding:12px}.title{font-size:16px}.refresh{padding:8px 10px}}
</style></head>
<body>
<header><div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><h1>🌲 Wood Press</h1><div class="sub">Polska + Niemcy · ostatnie 24 godziny</div></div><button id="refreshBtn" class="refresh">↻ Odśwież</button></div></header>
<main class="wrap">
<div class="note">Wersja 0.3.2 · frontend + API + silnik zbierający informacje. „Odśwież” naprawdę uruchamia pobieranie źródeł na serwerze, a potem przeładowuje listę.</div>
<div id="status" class="status"></div><div class="toolbar" id="filters"></div><div class="stats" id="stats"></div><section id="news"></section>
</main>
<script>
const categories=['Wszystkie','Drewno okrągłe','Branża drzewna','Ceny / rynek','Lasy Państwowe','Drewno poprodukcyjne','Polska','Niemcy'];
let selected='Wszystkie', busy=false;
const $=id=>document.getElementById(id);
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(x){try{return new Date(x).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'})}catch{return x}}
function renderFilters(){$('filters').innerHTML=categories.map(c=>`<button class="${c===selected?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;load()})}
function renderItems(items){$('news').innerHTML=items.length?items.map(x=>`<article class="card"><div class="top"><span>${x.country==='PL'?'🇵🇱':'🇩🇪'}</span><span>${fmt(x.published||x.added)}</span></div><div class="title">${esc(x.title)}</div><div class="summary">${esc(x.summary||'Brak krótkiego opisu w źródle.')}</div><div class="tags">${x.categories.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="source">Źródło: <a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.source||'źródło')} ↗</a></div></article>`).join(''):'<div class="empty">Brak materiałów z ostatnich 24 godzin w tej kategorii.</div>'}
async function load(){renderFilters();try{const r=await fetch('/api/news?hours=24&category='+encodeURIComponent(selected),{cache:'no-store'});if(!r.ok)throw new Error('API news '+r.status);const d=await r.json();$('stats').textContent=`${d.count} materiałów · ostatnie 24h · dane odświeżone ${fmt(d.updated)}`;renderItems(d.items)}catch(e){$('stats').textContent='';$('news').innerHTML='<div class="empty error">Nie udało się pobrać danych z API. Sprawdź połączenie z serwerem.</div>'}}
async function refresh(){if(busy)return;busy=true;const b=$('refreshBtn');b.disabled=true;b.textContent='… pobieram';$('status').textContent='Uruchamiam silnik zbierający informacje…';$('status').className='status';try{const r=await fetch('/api/refresh',{method:'POST',cache:'no-store'});if(!r.ok && r.status!==202)throw new Error('API refresh '+r.status);await pollRefresh()}catch(e){$('status').textContent='Błąd odświeżania: '+e.message;$('status').className='status error';busy=false;b.disabled=false;b.textContent='↻ Odśwież'}}
async function pollRefresh(){try{const r=await fetch('/api/refresh/status',{cache:'no-store'});if(!r.ok)throw new Error('API status '+r.status);const d=await r.json();if(d.running){$('status').textContent='Silnik pracuje — pobieram świeże materiały…';setTimeout(pollRefresh,2000);return}if(d.error)throw new Error(d.error);$('status').textContent=`Gotowe: dodano ${d.added} nowych materiałów · pobieranie trwało ${d.duration_seconds}s.`;$('status').className='status ok';busy=false;const b=$('refreshBtn');b.disabled=false;b.textContent='↻ Odśwież';await load()}catch(e){$('status').textContent='Błąd odświeżania: '+e.message;$('status').className='status error';busy=false;const b=$('refreshBtn');b.disabled=false;b.textContent='↻ Odśwież'}}
$('refreshBtn').onclick=refresh;load();
</script></body></html>
